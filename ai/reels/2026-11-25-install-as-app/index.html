<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><title>Coogle · 앱으로 설치</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
@font-face{font-family:P;font-weight:600;font-display:block;src:url(assets/fonts/Pretendard-SemiBold.woff2)}
@font-face{font-family:P;font-weight:700;font-display:block;src:url(assets/fonts/Pretendard-Bold.woff2)}
@font-face{font-family:P;font-weight:800;font-display:block;src:url(assets/fonts/Pretendard-ExtraBold.woff2)}
@font-face{font-family:P;font-weight:900;font-display:block;src:url(assets/fonts/Pretendard-Black.woff2)}
:root{--ink:#07080A;--paper:#F5F5F7;--mute:#9CA0AB;--iris:#8FA6FF;--iris4:#5B6CFF;--ember:#FF6A3D;--hue:#2B1670}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:P,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:radial-gradient(110% 60% at 50% 36%,var(--hue) 0%,color-mix(in srgb,var(--hue) 35%,transparent) 38%,var(--ink) 74%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.035) 1.5px,transparent 1.5px);background-size:90px 90px;mask:radial-gradient(70% 55% at 50% 40%,#000,transparent)}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:5;pointer-events:none}
#stage{position:absolute;inset:0;perspective:1500px;z-index:4}
.L{position:absolute;inset:0;visibility:hidden;transform-style:preserve-3d}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.75));z-index:6;pointer-events:none}
#grain{position:absolute;inset:-50%;width:200%;height:200%;opacity:.07;mix-blend-mode:overlay;z-index:7;pointer-events:none}
#fx{position:absolute;inset:0;z-index:30;pointer-events:none}#flash{position:absolute;inset:0;background:#fff;opacity:0}
#brand{position:absolute;left:0;right:0;top:86px;z-index:20;text-align:center;font-weight:800;font-size:30px;letter-spacing:-.02em;opacity:.85}
#brand i{display:inline-block;width:19px;height:19px;border-radius:50%;border:4px solid var(--paper);margin:0 1px;vertical-align:-1px}#brand i.f{background:var(--paper)}
/* footage window */
.win{position:absolute;left:40px;top:430px;width:1000px;height:600px;border-radius:26px;overflow:hidden;background:#111;box-shadow:0 0 0 2px rgba(255,255,255,.14),0 60px 120px -20px rgba(0,0,0,.9),0 0 160px color-mix(in srgb,var(--hue) 70%,transparent)}
.win img{position:absolute;left:0;top:0;width:1000px;height:562.5px;transform-origin:0 0}
.win .bar{position:absolute;left:0;right:0;bottom:0;height:38px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);font-size:19px;font-weight:700;color:rgba(255,255,255,.8);padding:10px 18px}
.ring{position:absolute;border:5px solid var(--iris);border-radius:14px;box-shadow:0 0 0 4px rgba(143,166,255,.25),0 0 40px rgba(143,166,255,.8)}
.cursorDot{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(143,166,255,.35);border:3px solid #fff}
/* titles */
.kick{position:absolute;left:0;right:0;top:180px;text-align:center;font-size:40px;font-weight:700;color:var(--mute);letter-spacing:-.02em}
.title{position:absolute;left:0;right:0;top:236px;text-align:center;font-size:84px;font-weight:900;letter-spacing:-.045em;line-height:1.06;text-shadow:0 10px 50px rgba(0,0,0,.8)}
.title em{font-style:normal;color:var(--iris)}
.chip{position:absolute;display:inline-flex;align-items:center;gap:12px;height:80px;padding:0 32px;border-radius:40px;background:var(--paper);color:var(--ink);font-weight:900;font-size:44px;letter-spacing:-.03em;white-space:nowrap;box-shadow:0 24px 60px -10px rgba(0,0,0,.7)}
.chip.iris{background:var(--iris)}.chip.ember{background:var(--ember)}.chip.dark{background:#15171d;color:var(--paper);border:2px solid rgba(255,255,255,.2)}
/* meme */
.meme{position:absolute;left:90px;top:500px;width:900px;height:740px;border:10px solid #fff;border-radius:8px;box-shadow:0 40px 100px rgba(0,0,0,.9);background:#000;overflow:hidden}
.meme img{display:block;width:100%;height:100%;object-fit:cover}
.memeTop{position:absolute;left:40px;right:40px;top:320px;text-align:center;font-size:72px;font-weight:900;letter-spacing:-.03em;color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke;line-height:1.1}
/* stamps */
.row{position:absolute;left:110px;right:110px;height:150px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;padding:0 40px;font-size:58px;font-weight:900;letter-spacing:-.03em;box-shadow:0 30px 70px -20px rgba(0,0,0,.8)}
.row .x{margin-left:auto;width:96px;height:96px;border-radius:50%;background:var(--ember);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:60px}
.row .strike{position:absolute;left:30px;top:50%;height:10px;width:0;background:var(--ember);border-radius:5px}
/* vs */
.vs{position:absolute;top:440px;width:460px;height:640px;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-size:76px;font-weight:900;letter-spacing:-.04em}
.vs small{font-size:30px;font-weight:700;color:var(--mute)}
/* captions */
#cap{position:absolute;left:0;right:0;top:1360px;z-index:40;text-align:center}
#cap .l1{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.14}
#cap .l2{font-size:72px;font-weight:900;letter-spacing:-.035em;line-height:1.14;color:var(--iris);display:inline-block}
#cap .l1,#cap .l2{paint-order:stroke;-webkit-text-stroke:9px rgba(7,8,10,.7);text-shadow:0 8px 30px rgba(0,0,0,.8)}
#credit{position:absolute;left:0;right:0;top:1640px;z-index:20;text-align:center;font-size:22px;font-weight:700;color:rgba(255,255,255,.45)}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div>
<div id="stage">
 <div class="L" id="L_win">
  <div class="kick" id="kick"></div><div class="title" id="title"></div>
  <div class="win" id="win"><img id="fimg"><div class="ring" id="ring" style="display:none"></div><div class="bar">영상: Anthropic (@ClaudeDevs)</div></div>
  <div class="chip iris" id="chipA" style="left:50%;top:1110px;transform:translateX(-50%);display:none"></div>
  <div class="chip dark" id="chipB" style="left:50%;top:1210px;transform:translateX(-50%);display:none"></div>
 </div>
 <div class="L" id="L_meme"><div class="memeTop" id="memeTop"></div><div class="meme" id="meme"><img id="mimg"></div></div>
 <div class="L" id="L_stamp">
  <div class="kick" style="top:250px">이거 다</div><div class="title" style="top:306px">필요 <em>없어요</em></div>
  <div class="row" id="r0" style="top:560px">앱스토어 심사<span class="strike"></span><div class="x">✕</div></div>
  <div class="row" id="r1" style="top:740px">코드 서명<span class="strike"></span><div class="x">✕</div></div>
  <div class="row" id="r2" style="top:920px">API 키<span class="strike"></span><div class="x">✕</div></div>
  <div class="chip iris" id="freeChip" style="left:50%;top:1140px;transform:translateX(-50%)">무료 플랜도 베타로 OK</div>
 </div>
 <div class="L" id="L_warn">
  <div class="kick" style="top:250px;color:var(--ember)">⚠ 하나만 알고 쓰세요</div>
  <div class="row" id="w0" style="top:520px;font-size:54px">📶 인터넷 끊기면<div style="margin-left:auto;color:var(--ember)">안 열림</div></div>
  <div class="row" id="w1" style="top:720px;font-size:54px;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px;height:220px">쓸 때마다 사용량 차감<div style="width:100%;height:30px;border-radius:15px;background:rgba(255,255,255,.12);overflow:hidden"><div id="gauge" style="height:100%;width:90%;border-radius:15px;background:linear-gradient(90deg,var(--ember),#ffb27a)"></div></div></div>
  <div class="row" id="w2" style="top:990px;font-size:48px">🔒 로그인 필요 · 맥/윈도우 데스크톱 앱</div>
 </div>
 <div class="L" id="L_vs">
  <div class="title" style="top:200px">진짜 앱 <em>vs</em> 포장지</div>
  <div class="vs" id="vsA" style="left:60px;background:linear-gradient(160deg,#1d2a66,#0c0f22);border:2px solid var(--iris)">🖥️<span>진짜 앱</span><small>아이콘·창·알림</small></div>
  <div class="vs" id="vsB" style="right:60px;background:linear-gradient(160deg,#3a1d12,#140b08);border:2px solid var(--ember)">🎁<span>포장지</span><small>웹앱 감싼 것</small></div>
  <div id="vsMid" style="position:absolute;left:50%;top:700px;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:64px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,0,0,.8)">VS</div>
 </div>
 <div class="L" id="L_cta">
  <div class="title" style="top:200px">댓글에 <em>'앱'</em></div>
  <div class="row" id="cbox" style="top:520px;height:120px;font-size:46px;border-radius:60px"><span id="typed"></span><span id="caret" style="width:4px;height:52px;background:var(--iris);margin-left:6px"></span><span style="margin-left:auto;color:var(--iris);font-size:40px">게시</span></div>
  <div id="dm" style="position:absolute;left:110px;right:110px;top:720px;border-radius:30px;background:#15171d;border:1.5px solid rgba(255,255,255,.18);padding:34px;box-shadow:0 40px 90px rgba(0,0,0,.85)">
   <div style="display:flex;align-items:center;gap:18px;font-weight:800;font-size:34px"><div style="width:70px;height:70px;border-radius:50%;background:#000;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:20px">C●●</div>coogle.ai<span style="margin-left:auto;font-size:24px;color:var(--mute)">지금</span></div>
   <div style="margin-top:24px;padding:24px 28px;border-radius:24px;background:var(--paper);color:var(--ink);font-weight:800;font-size:36px;line-height:1.4">📦 바로 만들 수 있는<br>앱 아이디어 10개 + 프롬프트</div>
  </div>
 </div>
</div>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="vig"></div>
<svg id="grain" viewBox="0 0 400 400" preserveAspectRatio="none"><filter id="gn"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="400" height="400" filter="url(#gn)"/></svg>
<div id="brand">C<i></i><i class="f"></i>gle</div>
<div id="credit"></div>
<div id="cap"></div>
<div id="fx"><div id="flash"></div></div>
<script type="module" src="main.js"></script>
</body></html>
