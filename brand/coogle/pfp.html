<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}
.c{width:1080px;height:1080px;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.grain{position:absolute;inset:0;opacity:.09;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.07),transparent 60%)}
/* A: heavy grotesk */
#A .t{font:900 250px 'Inter Display';letter-spacing:-14px;color:#fff;position:relative}
/* B: editorial italic serif */
#B .t{font:italic 600 270px 'Lora';letter-spacing:-8px;color:#fff;position:relative}
/* C: wordmark with ring oo */
#C .t{font:800 230px 'Inter Display';letter-spacing:-10px;color:#fff;position:relative;display:flex;align-items:center}
#C .ring{display:inline-block;width:150px;height:150px;border:30px solid #fff;border-radius:50%;box-sizing:border-box;margin:0 4px;position:relative;top:22px}
#C .ring.f{background:#fff}
</style></head><body>
<div class="c" id="A"><div class="vig"></div><div class="t">Coogle</div><div class="grain"></div></div>
<div class="c" id="B"><div class="vig"></div><div class="t">Coogle</div><div class="grain"></div></div>
<div class="c" id="C"><div class="vig"></div><div class="t">C<span class="ring"></span><span class="ring f"></span>gle</div><div class="grain"></div></div>
</body></html>
