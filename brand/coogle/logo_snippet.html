<!-- Coogle 워드마크(프로필 사진 C안과 동일: brand/coogle/pfp.html #C). 모든 영상·표지·자료에서 이 모양만 쓴다.
     글꼴 Inter Display 800, 자간 -0.044em, oo = 테두리 원 + 꽉 찬 원(지름 0.652em, 테두리 0.13em, 아래로 0.096em).
     밝은 배경은 --ink:#111, 어두운 배경은 --ink:#fff. 크기는 font-size만 바꾸면 비율 유지. -->
<style>
.coogle{display:inline-flex;align-items:center;font:800 50px 'Inter Display';letter-spacing:-.044em;color:var(--ink,#111)}
.coogle .ring{display:inline-block;width:.652em;height:.652em;border:.13em solid currentColor;border-radius:50%;box-sizing:border-box;margin:0 .018em;position:relative;top:.096em}
.coogle .ring.f{background:currentColor}
</style>
<span class="coogle">C<span class="ring"></span><span class="ring f"></span>gle</span>
