<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AI 구독료 정리 견본 v2</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0f14; font-family: "Noto Sans KR", sans-serif; color: #fff; }
      #root { position: absolute; inset: 0; }
      .bg { position: absolute; inset: 0; background: radial-gradient(1000px 800px at 85% 15%, #2b1d6b 0%, transparent 60%), radial-gradient(900px 700px at 0% 85%, #0e3b4a 0%, transparent 60%), #0d0f14; }
      .bar { position: absolute; top: 236px; left: 70px; width: 780px; height: 8px; border-radius: 4px; background: #262a35; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, #7c5cff, #31d0aa); }
      .tag { position: absolute; top: 258px; left: 70px; font-size: 32px; font-weight: 700; color: #9aa3b2; }
      .scene { position: absolute; inset: 0; }
      .hook { position: absolute; top: 520px; left: 70px; width: 780px; font-size: 100px; font-weight: 900; line-height: 1.2; letter-spacing: -3px; }
      .hook b { display: inline-block; color: #0d0f14; background: #ffd35c; padding: 0 18px; border-radius: 16px; }
      .hooksub { position: absolute; top: 950px; left: 70px; width: 780px; font-size: 46px; font-weight: 700; color: #c9d0dc; }
      .chip { position: absolute; top: 1080px; left: 70px; font-size: 38px; font-weight: 700; padding: 14px 26px; border-radius: 40px; background: #1b2a26; color: #5ee3b4; }
      .step { position: absolute; top: 320px; left: 70px; width: 780px; font-size: 56px; font-weight: 900; letter-spacing: -1px; }
      .step em { font-style: normal; display: inline-block; width: 76px; height: 76px; line-height: 76px; text-align: center; border-radius: 20px; background: #7c5cff; margin-right: 18px; }
      #rec { position: absolute; top: 420px; left: 70px; width: 780px; height: 780px; object-fit: cover; object-position: 50% 100%; border-radius: 34px; border: 3px solid #2d3240; background: #fff; }
      .hl { position: absolute; left: 70px; width: 780px; border: 6px solid #ffd35c; border-radius: 24px; opacity: 0; }
      .sub { position: absolute; top: 1230px; left: 70px; width: 780px; font-size: 48px; font-weight: 800; line-height: 1.3; }
      .sub span { background: rgba(0,0,0,.72); padding: 4px 14px; border-radius: 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
      .card { position: absolute; top: 420px; left: 70px; width: 780px; border-radius: 34px; background: #171a22; border: 2px solid #2d3240; padding: 40px; }
      .card h3 { font-size: 46px; font-weight: 900; margin-bottom: 26px; }
      .row { display: flex; justify-content: space-between; font-size: 40px; padding: 18px 22px; border-radius: 16px; margin-top: 12px; background: #20242e; }
      .row.x { background: #3a3218; color: #ffd35c; }
      .row s { opacity: .55; }
      .big { position: absolute; top: 1060px; left: 70px; width: 780px; font-size: 64px; font-weight: 900; line-height: 1.25; }
      .big b { color: #5ee3b4; }
      .msg { margin-top: 10px; background: #2b2f3b; border-radius: 28px; padding: 30px 34px; font-size: 42px; line-height: 1.5; white-space: pre-wrap; min-height: 210px; }
      .cursor { display: inline-block; width: 5px; height: 44px; background: #fff; vertical-align: -6px; margin-left: 4px; }
      .cta { position: absolute; top: 560px; left: 70px; width: 780px; font-size: 92px; font-weight: 900; line-height: 1.22; letter-spacing: -2px; }
      .cta small { display: block; margin-top: 46px; font-size: 48px; font-weight: 800; color: #0d0f14; background: #ffd35c; padding: 18px 26px; border-radius: 20px; letter-spacing: 0; width: fit-content; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div class="bg"></div>
      <video id="rec" class="clip" src="assets/rec.mp4" data-start="2.4" data-duration="9" muted playsinline></video>
      <div class="bar"><i id="pb"></i></div>
      <div class="tag">AI로 생활비 줄이기 · 1편</div>

      <div id="s1" class="scene clip" data-start="0" data-duration="2.4">
        <div class="hook" id="hook">구독료 새는 거<br /><b>AI한테 30초에</b><br />찾는 법</div>
        <div class="hooksub" id="hooksub">카드 명세서만 있으면 됨</div>
        <div class="chip" id="hookchip">프롬프트 그대로 따라 하기</div>
      </div>

      <div id="s2" class="scene clip" data-start="2.4" data-duration="9">
        <div class="step"><em>1</em>명세서 붙이고 이렇게</div>
        <div class="hl" id="hl1" style="top: 560px; height: 300px"></div>
        <div class="sub" id="sub1"><span>카드 앱에서 명세서 복사해서</span></div>
        <div class="sub" id="sub2"><span>이 문장 그대로 붙여 넣기</span></div>
        <div class="sub" id="sub3"><span>반복 결제만 표로 쫙 나옴</span></div>
        <div class="sub" id="sub4"><span>겹치는 건 노란색으로 표시</span></div>
      </div>

      <div id="s3" class="scene clip" data-start="11.4" data-duration="4">
        <div class="step"><em>✓</em>겹치는 것만 남기면</div>
        <div class="card" id="card">
          <h3>반복 결제 5건</h3>
          <div class="row x" id="r1"><span>영상 스트리밍 A · B</span><span>둘 중 하나</span></div>
          <div class="row x" id="r2"><span>클라우드 · 사진 백업</span><span>둘 중 하나</span></div>
          <div class="row" id="r3"><span>음악 앱</span><span>유지</span></div>
        </div>
        <div class="big" id="big">겹치는 4건이<br /><b>2건으로</b></div>
      </div>

      <div id="s4" class="scene clip" data-start="15.4" data-duration="2.6">
        <div class="step"><em>2</em>해지 순서도 물어보기</div>
        <div class="card"><div class="msg" id="m2"></div></div>
        <div class="sub" style="top: 1000px"><span>결제일 가까운 것부터 알려 줌</span></div>
      </div>

      <div id="s5" class="scene clip" data-start="18" data-duration="2">
        <div class="cta" id="cta">프롬프트 3개<br />캡션에 그대로<small>'받기' 댓글이면 DM으로 보내드림</small></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#pb", { scaleX: 1, duration: 20, ease: "none" }, 0);
      // hook: fully visible at frame 0, emphasis only
      tl.fromTo("#hook b", { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, 0.5);
      tl.fromTo("#hookchip", { y: 0 }, { y: -10, duration: 0.3, yoyo: true, repeat: 1 }, 1.4);
      // recording: input at bottom while typing, then pan to the conversation
      tl.set("#rec", { objectPosition: "50% 100%" }, 2.4);
      tl.to("#rec", { objectPosition: "50% 0%", duration: 0.6, ease: "power2.inOut" }, 5.4);
      tl.fromTo("#hl1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.0);
      tl.to("#hl1", { opacity: 0, duration: 0.2 }, 7.4);
      const subs = [["#sub1", 2.4, 4.4], ["#sub2", 4.4, 6.4], ["#sub3", 6.4, 9.4], ["#sub4", 9.4, 11.4]];
      subs.forEach(([s, a, b]) => { tl.fromTo(s, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.15 }, a); tl.set(s, { opacity: 0 }, b - 0.01); });
      // result card
      tl.from("#card", { scale: 0.94, opacity: 0, duration: 0.3, ease: "back.out(1.6)" }, 11.4);
      tl.from(["#r1", "#r2", "#r3"], { x: -40, opacity: 0, duration: 0.25, stagger: 0.35 }, 11.7);
      tl.from("#big", { y: 30, opacity: 0, duration: 0.3 }, 13.0);
      tl.to("#card", { scale: 1.04, duration: 1.2, ease: "none" }, 13.3);
      // step 2 typing
      const text = "해지할 것만 결제일 가까운\n순서로 정렬하고, 앱마다\n해지 메뉴 위치 알려 줘.";
      const o = { n: 0 }; const el = document.getElementById("m2");
      tl.to(o, { n: text.length, duration: 1.6, ease: "none", onUpdate: () => { const k = Math.round(o.n); el.innerHTML = text.slice(0, k) + (k < text.length ? '<span class="cursor"></span>' : ""); } }, 15.5);
      tl.from("#cta small", { y: 30, opacity: 0, duration: 0.3 }, 18.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
