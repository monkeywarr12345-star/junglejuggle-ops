<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AI 구독료 정리 견본 v3</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="timeline.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 500; font-display: block; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 600; font-display: block; src: url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; font-display: block; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; font-display: block; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 900; font-display: block; src: url("assets/fonts/Pretendard-Black.woff2") format("woff2"); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #efe7dc; font-family: "Pretendard", "Noto Sans CJK KR", sans-serif; color: #1c1b1f; -webkit-font-smoothing: antialiased; }
      #root { position: absolute; inset: 0; overflow: hidden; }
      .bg { position: absolute; inset: 0; background: radial-gradient(900px 700px at 80% 8%, #fff7ec 0%, transparent 65%), radial-gradient(900px 900px at 10% 100%, #f2d9c0 0%, transparent 60%), #efe7dc; }
      .scene { position: absolute; inset: 0; visibility: hidden; }

      /* headline (top, inside safe area) */
      .head { position: absolute; top: 240px; left: 64px; width: 880px; font-weight: 900; font-size: 84px; line-height: 1.18; letter-spacing: -2.5px; color: #1c1b1f; }
      .head .mk { position: relative; display: inline-block; z-index: 0; }
      .head .mk::before { content: ""; position: absolute; left: -8px; right: -8px; bottom: 8px; height: 38px; background: #ffcf3f; border-radius: 6px; z-index: -1; transform-origin: left center; transform: scaleX(var(--mk, 1)); }
      .head small { display: block; font-size: 40px; font-weight: 700; letter-spacing: -1px; color: #6b6259; margin-bottom: 14px; }

      /* captions (white + dark stroke, above bottom UI zone) */
      #cap { position: absolute; left: 70px; width: 780px; top: 1190px; text-align: center; font-weight: 800; font-size: 58px; line-height: 1.25; letter-spacing: -1.5px; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 11px #1c1b1f; z-index: 50; }
      #cap b { color: #ffcf3f; }
      #cap > div { position: absolute; left: 0; right: 0; top: 0; }

      /* illustration plates */
      .plate { position: absolute; overflow: hidden; border-radius: 0; }
      .plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .plate.fb { background: linear-gradient(160deg, #f6dcc2, #e9c9a8); }

      /* S1 hook */
      #s1 .plate { left: 0; top: 330px; width: 1080px; height: 1920px; }
      #s1 .shade { position: absolute; inset: 0; background: linear-gradient(180deg, #efe7dc 0%, #efe7dc 17%, rgba(239,231,220,0) 30%, rgba(0,0,0,0) 70%, rgba(28,27,31,.28) 100%); }
      .chip { position: absolute; font-weight: 800; font-size: 40px; padding: 14px 24px; border-radius: 18px; background: #fff; box-shadow: 0 14px 40px rgba(60,40,20,.22); letter-spacing: -1px; }
      .chip i { font-style: normal; color: #e5484d; margin-left: 10px; }

      /* app window (camera wrapper) */
      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
      .desk { position: absolute; inset: 0; }
      .win { position: absolute; left: 60px; top: 410px; width: 820px; height: 860px; background: #fff; border-radius: 30px; box-shadow: 0 50px 120px rgba(70,45,20,.28), 0 0 0 1px rgba(0,0,0,.06); overflow: hidden; }
      .win .bar { height: 70px; display: flex; align-items: center; gap: 12px; padding-left: 26px; border-bottom: 1px solid #eee; background: #fafafa; }
      .win .bar span { width: 18px; height: 18px; border-radius: 9px; }
      .win .bar span:nth-child(1) { background: #ff5f57; } .win .bar span:nth-child(2) { background: #febc2e; } .win .bar span:nth-child(3) { background: #28c840; }
      .win .bar p { margin-left: 20px; font-size: 26px; font-weight: 600; color: #8a8a8e; }
      .thread { position: absolute; left: 0; right: 0; top: 70px; bottom: 20px; padding: 30px 40px; overflow: hidden; }
      .ubub { margin-left: auto; width: fit-content; max-width: 640px; background: #f1f1f3; border-radius: 30px; padding: 20px 28px; font-size: 32px; line-height: 1.45; font-weight: 500; }
      .paste { margin-left: auto; width: 640px; background: #f7f7f9; border: 1px solid #ececf0; border-radius: 22px; padding: 20px 26px; font-size: 29px; line-height: 1.6; color: #6f6f76; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; margin-bottom: 14px; }
      .paste em { font-style: normal; display: inline-block; background: #e9e9ee; border-radius: 6px; padding: 0 8px; font-family: "Pretendard"; font-weight: 700; font-size: 24px; color: #55555b; margin-bottom: 6px; }
      .ans { margin-top: 24px; font-size: 34px; line-height: 1.5; font-weight: 500; }
      .ans .lead { margin-bottom: 16px; }
      table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 36px; }
      table.t th { text-align: left; font-weight: 700; color: #6b6b72; font-size: 26px; padding: 8px 14px; border-bottom: 2px solid #ececf0; }
      table.t td { padding: 12px 14px; font-weight: 600; border-bottom: 1px solid #f0f0f3; position: relative; }
      table.t td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
      table.t tr.dup td { background: linear-gradient(90deg, rgba(255,207,63,.55), rgba(255,207,63,.55)) no-repeat; background-size: var(--hl, 0%) 100%; }
      table.t tr.dup td:first-child { border-radius: 10px 0 0 10px; } table.t tr.dup td:last-child { border-radius: 0 10px 10px 0; }
      .tag { display: inline-block; font-size: 22px; font-weight: 800; padding: 3px 10px; border-radius: 8px; background: #1c1b1f; color: #ffcf3f; margin-left: 10px; vertical-align: 3px; opacity: 0; }
      .composer { position: absolute; left: 30px; right: 30px; bottom: 30px; height: 112px; border-radius: 56px; border: 1.5px solid #e3e3e8; background: #fff; display: flex; align-items: center; padding: 0 22px 0 34px; box-shadow: 0 8px 24px rgba(0,0,0,.05); }
      .composer .ph { font-size: 38px; color: #a3a3a9; flex: 1; white-space: nowrap; overflow: hidden; }
      .composer .ph.on { color: #1c1b1f; font-weight: 500; }
      .composer .send { width: 62px; height: 62px; border-radius: 31px; background: #d9d9de; display: grid; place-items: center; }
      .composer .send svg { width: 30px; height: 30px; }
      .caret { display: inline-block; width: 3px; height: 34px; background: #1c1b1f; vertical-align: -6px; margin-left: 2px; }
      .cursor { position: absolute; width: 46px; height: 46px; z-index: 40; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
      .ripple { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 5px solid #ffcf3f; z-index: 39; opacity: 0; }

      /* real recording card (video is a root-level clip; camera moves are baked in by build.py) */
      #rec { position: absolute; left: 40px; top: 470px; width: 1000px; height: 700px; border-radius: 28px; background: #fafafa; box-shadow: 0 40px 100px rgba(70,45,20,.28), 0 0 0 2px #1c1b1f; object-fit: cover; }
      .hlbar { position: absolute; border-radius: 10px; background: rgba(255,207,63,.5); mix-blend-mode: multiply; transform-origin: 0 50%; transform: scaleX(0); z-index: 5; }
      .recrip { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 6px solid #ffcf3f; z-index: 6; opacity: 0; }

      /* S6 result */
      #s6 .plate { left: 0; top: 760px; width: 1080px; height: 1920px; }
      #s6 .fade { position: absolute; left: 0; right: 0; top: 760px; height: 110px; background: linear-gradient(180deg, #efe7dc, rgba(239,231,220,0)); }
      .save { position: absolute; left: 64px; top: 470px; width: 900px; }
      .save .row { display: flex; align-items: baseline; gap: 20px; font-weight: 900; letter-spacing: -3px; }
      .save .big { font-size: 150px; color: #e5484d; font-variant-numeric: tabular-nums; }
      .save .unit { font-size: 64px; color: #1c1b1f; }
      .save .yr { margin-top: 10px; font-size: 54px; font-weight: 800; color: #6b6259; letter-spacing: -1px; }
      .save .yr b { color: #1c1b1f; }

      /* S7 CTA */
      .cards { position: absolute; left: 64px; top: 520px; width: 610px; height: 560px; }
      .save .yr b { background: linear-gradient(transparent 58%, #ffcf3f 58%); padding: 0 4px; }
      .dim { position: absolute; inset: 0; background: rgba(239,231,220,.82); opacity: 0; }
      .bigc { position: absolute; left: 64px; top: 620px; width: 820px; height: 150px; border-radius: 75px; background: #fff; box-shadow: 0 30px 80px rgba(70,45,20,.25), 0 0 0 2px #1c1b1f; display: flex; align-items: center; padding: 0 26px 0 46px; opacity: 0; }
      .bigc .ph { font-size: 46px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; color: #1c1b1f; letter-spacing: -1px; }
      .bigc .send { width: 98px; height: 98px; border-radius: 49px; background: #d9d9de; display: grid; place-items: center; flex: none; }
      .bigc .send svg { width: 46px; height: 46px; }
      .bigc .caret { height: 50px; width: 4px; vertical-align: -8px; }
      .pose { position: absolute; height: auto; opacity: 0; }
      .pcard { position: absolute; left: 0; width: 610px; height: 150px; border-radius: 28px; background: #fff; box-shadow: 0 24px 60px rgba(70,45,20,.18); display: flex; align-items: center; gap: 26px; padding: 0 34px; font-size: 40px; font-weight: 800; letter-spacing: -1px; }
      .pcard .n { width: 74px; height: 74px; border-radius: 22px; background: #1c1b1f; color: #ffcf3f; display: grid; place-items: center; font-size: 38px; font-weight: 900; flex: none; }
      .pcard small { display: block; font-size: 29px; font-weight: 600; color: #8a8178; margin-top: 4px; letter-spacing: 0; }
      .savebtn { position: absolute; left: 64px; top: 1040px; display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 900; letter-spacing: -1px; background: #1c1b1f; color: #fff; padding: 22px 34px; border-radius: 24px; }
      .savebtn svg { width: 44px; height: 44px; }
      .brand { position: absolute; left: 64px; top: 150px; font-size: 28px; font-weight: 800; color: #8a8178; letter-spacing: -.5px; z-index: 60; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div class="bg"></div>

      <!-- S1 hook -->
      <div id="s1" class="scene">
        <div class="plate" id="p1"><img src="assets/img0.jpg" onerror="this.parentNode.classList.add('fb');this.remove()" /></div>
        <div class="shade"></div>
        <div class="head" id="h1"><small>AI로 생활비 줄이기 · 1편</small>매달 새는 <span style="color: #e5484d">27,200원</span><br /><span class="mk" id="mk1">AI로 30초 컷</span></div>
        <div class="chip" id="c1" style="left: 40px; top: 650px">영상 앱<i>-13,900</i></div>
        <div class="chip" id="c2" style="left: 70px; top: 830px">음악 앱<i>-10,900</i></div>
        <div class="chip" id="c3" style="left: 30px; top: 1010px">클라우드<i>-2,400</i></div>
      </div>

      <!-- S2..S5: real screen recording (assets/rec_cut.mp4, built by build.py from assets/rec1.mp4) -->
      <video id="rec" class="clip" src="assets/rec_cut.mp4" data-start="2" data-duration="9" muted playsinline></video>
      <div id="sApp" class="scene">
        <div class="plate" id="p2" style="left: 0; top: 0; width: 1080px; height: 1920px"><img src="assets/img6.jpg" onerror="this.parentNode.classList.add('fb');this.remove()" /></div>
        <div class="hlbar" id="hb1"></div><div class="hlbar" id="hb2"></div><div class="hlbar" id="hb3"></div>
        <div class="recrip" id="rip"></div>
        <img class="pose" id="cut4" src="assets/cut4.png" style="left: 790px; top: 1150px; width: 290px" onerror="this.remove()" />
        <img class="pose" id="cut3b" src="assets/cut3.png" style="left: 0px; top: 1150px; width: 290px" onerror="this.remove()" />
        <div class="head" id="h2"><small>STEP 1</small>내역에 <span class="mk" id="mk2">한 줄 붙이기</span></div>
        <div class="head" id="h3" style="opacity: 0"><small>STEP 2</small>보내면 <span class="mk" id="mk3">표가 바로</span></div>
        <div class="head" id="h4" style="opacity: 0"><small>STEP 3</small>겹치는 구독 <span class="mk" id="mk4">바로 보임</span></div>
      </div>

      <!-- S6 result -->
      <div id="s6" class="scene">
        <div class="plate" id="p3"><img src="assets/img2.jpg" onerror="this.parentNode.classList.add('fb');this.remove()" /></div>
        <div class="fade"></div>
        <div class="head" id="h6"><small>결과</small>하나씩만 남겼더니</div>
        <div class="save"><div class="row"><span class="big" id="cnt">0</span><span class="unit">원 / 월</span></div><div class="yr" id="yr">1년이면 <b>326,400원</b> 아낌</div></div>
      </div>

      <!-- S7 CTA -->
      <div id="s7" class="scene">
        <div class="head" id="h7"><small>저장해두고 월말에 한 번</small>프롬프트 3개<br /><span class="mk" id="mk7">캡션에 그대로</span></div>
        <div class="cards">
          <div class="pcard" id="k1" style="top: 0"><div class="n">1</div><div>반복 결제만 표로<small>명세서 붙여 넣고 한 줄</small></div></div>
          <div class="pcard" id="k2" style="top: 170px"><div class="n">2</div><div>겹치는 것 찾기<small>하나만 남길 이유까지</small></div></div>
          <div class="pcard" id="k3" style="top: 340px"><div class="n">3</div><div>해지 순서 받기<small>결제일 가까운 것부터</small></div></div>
        </div>
        <div id="cut3w" style="position: absolute; left: 640px; top: 780px; width: 440px; transform: scaleX(-1)"><img id="cut3" src="assets/cut3.png" style="width: 100%; height: auto; display: block" onerror="this.remove()" /></div>
        <div class="savebtn" id="sb"><svg viewBox="0 0 24 24" fill="#ffcf3f"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z" /></svg>저장해 두기</div>
      </div>

      <div id="cap"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const T = window.TL; // generated: {dur, s:{id:[start,end]}, caps:[[t0,t1,html]], cue:{...}}
      const tl = gsap.timeline({ paused: true });
      const S = (id) => T.s[id];
      const show = (sel, a, b) => { tl.set(sel, { visibility: "visible" }, a); tl.set(sel, { visibility: "hidden" }, b); };

      // ---------- S1 hook (visible at frame 0) ----------
      show("#s1", 0, S("s1")[1]);
      tl.fromTo("#p1", { scale: 1.12, y: 0 }, { scale: 1.0, y: -20, duration: S("s1")[1], ease: "power1.out" }, 0);
      tl.fromTo("#mk1", { scale: 1 }, { scale: 1.07, duration: 0.22, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 50%" }, 0.3);
      [["#c1", 0.35], ["#c2", 0.75], ["#c3", 1.15]].forEach(([c, t]) => tl.fromTo(c, { scale: 0.4, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.32, ease: "back.out(2.2)" }, t));
      tl.to(["#c1", "#c2", "#c3"], { y: -14, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.2 }, 1.4);

      // ---------- App (S2..S5): real recording; zoom/pan already baked into the clip ----------
      const a0 = S("s2")[0], a1 = S("s5")[1], s3 = S("s3"), s4 = S("s4"), s5 = S("s5");
      show("#sApp", a0, a1);
      // laptop illustration zooms into the screen, then reveals the recording card underneath
      tl.fromTo("#p2", { scale: 1.06 }, { scale: 1.0, duration: 0.6, ease: "power1.out" }, a0);
      tl.to("#p2", { scale: 3.0, transformOrigin: "700px 580px", opacity: 0, duration: 0.5, ease: "power2.in" }, a0 + 0.45);
      tl.fromTo("#h2", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, a0 + 0.05);
      tl.fromTo("#mk2", { "--mk": 0 }, { "--mk": 1, duration: 0.3 }, a0 + 0.35);
      // STEP 1 -> send click
      tl.fromTo("#cut4", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, s3[0]);
      tl.set("#rip", { left: T.rip[0] - 55, top: T.rip[1] - 55 }, a0);
      tl.fromTo("#rip", { scale: 0.3, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.5 }, T.cue.send);
      tl.to("#cut4", { x: 300, opacity: 0, duration: 0.3, ease: "power2.in" }, T.cue.send + 0.1);
      // STEP 2: answer streams in
      tl.to("#h2", { opacity: 0, duration: 0.15 }, s4[0] - 0.2);
      tl.fromTo("#h3", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, s4[0] - 0.02);
      tl.fromTo("#mk3", { "--mk": 0 }, { "--mk": 1, duration: 0.3 }, s4[0] + 0.1);
      // STEP 3: overlap rows highlighted on top of the real table
      tl.to("#h3", { opacity: 0, duration: 0.15 }, s5[0] - 0.12);
      tl.fromTo("#h4", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, s5[0] + 0.05);
      tl.fromTo("#mk4", { "--mk": 0 }, { "--mk": 1, duration: 0.3 }, s5[0] + 0.2);
      T.hl.forEach((r, i) => {
        const id = "#hb" + (i + 1);
        tl.set(id, { left: r[0], top: r[1], width: r[2], height: r[3] }, a0);
        tl.to(id, { scaleX: 1, duration: 0.35, ease: "power2.out" }, [T.cue.hl1, T.cue.hl2, T.cue.hl3][i]);
      });
      tl.fromTo("#cut3b", { y: 400, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, s5[0] + 0.1);
      tl.to("#cut3b", { y: -14, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, s5[0] + 0.6);

      // ---------- S6 result ----------
      const r = S("s6");
      show("#s6", r[0], r[1]);
      tl.fromTo("#p3", { scale: 1.1, y: 60 }, { scale: 1.0, y: 0, duration: r[1] - r[0], ease: "power1.out" }, r[0]);
      tl.fromTo("#h6", { scale: 0.96 }, { scale: 1, duration: 0.3 }, r[0]);
      const cnt = { v: 0 }; const ce = document.getElementById("cnt");
      tl.to(cnt, { v: 27200, duration: 1.0, ease: "power2.out", onUpdate: () => { ce.textContent = "-" + Math.round(cnt.v).toLocaleString("ko-KR"); } }, T.cue.count0);
      tl.fromTo(".save .row", { scale: 0.85 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, T.cue.count0);
      tl.fromTo("#yr", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, T.cue.count0 + 1.05);
      tl.to("#yr b", { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, display: "inline-block" }, T.cue.count0 + 1.4);

      // ---------- S7 CTA ----------
      const c = S("s7");
      show("#s7", c[0], T.dur + 1);
      tl.fromTo("#h7", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, c[0]);
      tl.fromTo("#mk7", { "--mk": 0 }, { "--mk": 1, duration: 0.3 }, c[0] + 0.3);
      tl.to(".cards", { scale: 1.04, transformOrigin: "0% 0%", duration: T.dur - c[0], ease: "none" }, c[0]);
      tl.fromTo(["#k1", "#k2", "#k3"], { x: 900, rotation: 6 }, { x: 0, rotation: 0, duration: 0.45, ease: "power3.out", stagger: 0.18 }, c[0] + 0.15);
      tl.fromTo("#cut3", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, c[0] + 0.05);
      tl.to("#cut3", { y: -12, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, c[0] + 0.6);
      tl.fromTo("#sb", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" }, c[0] + 0.9);
      tl.to("#sb", { scale: 1.06, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, c[0] + 1.4);

      // ---------- captions ----------
      const cap = document.getElementById("cap");
      T.caps.forEach(([t0, t1, html, sid], i) => {
        const d = document.createElement("div"); d.id = "cp" + i; d.innerHTML = html; d.style.visibility = "hidden"; cap.appendChild(d);
        if (sid === "s6") d.style.top = "-330px";
        if (sid === "s7") d.style.right = "190px";
        if (sid === "s3" || sid === "s4") d.style.right = "200px";
        if (sid === "s5") d.style.left = "220px";
        show(d, t0, t1);
        tl.fromTo(d, { scale: 0.9 }, { scale: 1, duration: 0.14, ease: "back.out(2)" }, t0);
      });
      tl.set({}, {}, T.dur);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
