name: Publish to Instagram

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (UTC); GitHub may delay a few minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["queue/**"]

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due posts
        id: run
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/publish.py

      - name: Save queue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update queue after publish run [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Report failures
        if: steps.run.outcome == 'failure'
        run: |
          echo "Some posts failed. See failed/ for details."
          exit 1
