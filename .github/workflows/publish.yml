name: Publish to Instagram

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 minutes (UTC); GitHub often skips or delays scheduled runs, so poll often (public repo: free)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["queue/**"]

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest queue: a run that waited in line must not see items an earlier run already posted

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due posts
        id: run
        continue-on-error: true
        env:
          IG_LOGIN_TOKEN: ${{ secrets.IG_LOGIN_TOKEN }}   # Instagram Login (no Facebook), used first
          IG_LOGIN_USER_ID: ${{ secrets.IG_LOGIN_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/publish.py

      - name: Save queue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update queue after publish run [skip ci]"
            # Retry: a concurrent push (another session, render run) must never leave a published item in queue/,
            # or the next run would post it a second time (2026-11-09 Huang x Bezos carousel near-duplicate).
            for i in 1 2 3 4 5 6; do
              git pull --rebase && git push && exit 0
              echo "push failed (attempt $i), retrying"; sleep $((i * 5))
            done
            exit 1
          fi

      - name: Report failures
        if: steps.run.outcome == 'failure'
        run: |
          echo "Some posts failed. See failed/ for details."
          exit 1
