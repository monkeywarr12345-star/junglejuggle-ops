name: research bench topics (experiment branch only)
on:
  push:
    branches: [research/ai-tools-2026-11]
    paths: ['research/tools/bench_topics.py', '.github/workflows/research-topics.yml']
permissions:
  contents: write
jobs:
  bench_topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/tools/bench_topics.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - run: |
          mkdir -p research/results/bench && cp research/out/bench_topics.json research/results/bench/ || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add research/results/bench && git commit -m "research: bench topics (derived fields only)" && git pull --rebase -q && git push || true
