name: Render media (photos and music)

on:
  push:
    branches: [main]
    paths: ["content/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-media
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for specs that need rendering
        id: check
        run: |
          if grep -l '"render_in_actions": *true' content/*.json >/dev/null 2>&1; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: "3.12"
      - name: Install fonts, ffmpeg and Chromium
        if: steps.check.outputs.needed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg >/dev/null
          pip install -q playwright numpy scipy
          python -m playwright install --with-deps chromium >/dev/null
      - name: Render
        id: render
        if: steps.check.outputs.needed == 'true'
        continue-on-error: true
        run: python scripts/remote_render.py
      - name: Save media
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media; [ -d music ] && git add -A music || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Render media [skip ci]"; git pull --rebase; git push; fi
      - name: Report failures
        if: steps.render.outcome == 'failure'
        run: |
          echo "Some specs failed to render. See media/<id>/src/error.txt"
          exit 1
