name: research v3 tts eval (experiment branch only)
on:
  push:
    branches: [research/ai-tools-2026-11]
    paths: ['research/tools/v3eval/**']
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null || true
      - run: pip install -q faster-whisper librosa soundfile
      - run: python research/tools/v3eval/eval.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add research/results/v3tools/eval.json && git commit -qm "research: v3 tts eval" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
