name: research v3 sample (experiment branch only)
on:
  push:
    branches: [research/ai-tools-2026-11]
    paths: ['research/samples/v3/**']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-noto-cjk >/dev/null || true
      - name: voice deps
        run: |
          pip install -q numpy soundfile pillow scipy
          if grep -q "^qwen\|^chatterbox" research/samples/v3/voice.txt; then pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu; fi
          grep -q "^qwen" research/samples/v3/voice.txt && pip install -q -U qwen-tts || true
          grep -q "^supertonic" research/samples/v3/voice.txt && pip install -q supertonic || true
          grep -q "^chatterbox" research/samples/v3/voice.txt && pip install -q chatterbox-tts || true
      - name: assets
        working-directory: research/samples/v3
        run: |
          mkdir -p assets/fonts; for W in Medium SemiBold Bold ExtraBold Black; do curl -sfL -o assets/fonts/Pretendard-$W.woff2 https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-$W.woff2 || echo font-fail $W; done
          for i in 0 1 2 3 4 5 6; do f=../../results/v3tools/img/img$i.jpg; [ -f $f ] && [ ! -f assets/img$i.jpg ] && python -c "from PIL import Image;Image.open('$f').resize((1080,1920),Image.LANCZOS).save('assets/img$i.jpg',quality=92)"; done
          for i in 3 4 5; do [ -f assets/img$i.jpg ] && python cutout.py assets/img$i.jpg assets/cut$i.png; done; ls assets
      - name: build, render, mix (one video per voice line)
        env: { HYPERFRAMES_TELEMETRY_DISABLED: "1", DO_NOT_TRACK: "1" }
        run: |
          OUT=research/results/v3; mkdir -p $OUT; rm -f $OUT/v3_*.mp4 $OUT/voices.txt $OUT/timeline_*.json
          printf "skip\n" > /dev/null
          MUSIC=$(head -1 research/samples/v3/music.txt)
          K=0
          while IFS= read -r VOICE; do
            [ -z "$VOICE" ] && continue
            TAG=$(echo ABCDEFGH | cut -c$((K+1))); K=$((K+1)); W=/tmp/v3/$TAG; mkdir -p $W
            echo "== $TAG: $VOICE"
            (cd research/samples/v3 && python build.py "$VOICE" $W < /dev/null) || { echo "build fail $TAG"; continue; }
            (cd research/samples/v3 && npx -y hyperframes@latest render --output $W/silent.mp4 > $W/render.log 2>&1 < /dev/null) || { tail -30 $W/render.log; continue; }
            DUR=$(python -c "import json;print(json.load(open('$W/timeline.json'))['dur'])"); FO=$(python -c "print(round($DUR-1.2,2))")
            ffmpeg -nostdin -y -loglevel error -i $W/silent.mp4 -i $W/narration.wav -i $W/sfx.wav -stream_loop -1 -i "$MUSIC" -filter_complex \
              "[1:a]aresample=48000,asplit[n][nk];[2:a]aresample=48000,volume=0.7[s];[3:a]aresample=48000,volume=0.16,afade=t=in:d=0.4,afade=t=out:st=$FO:d=1.2[m0];[m0][nk]sidechaincompress=threshold=0.02:ratio=6:attack=15:release=350[m];[n][s][m]amix=inputs=3:normalize=0:duration=first,alimiter=limit=0.95[a]" \
              -map 0:v -map "[a]" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -t $DUR $OUT/v3_$TAG.mp4
            cp $W/timeline.json $OUT/timeline_$TAG.json; echo "$TAG: $VOICE" >> $OUT/voices.txt
          done < research/samples/v3/voice.txt
          F=$(ls $OUT/v3_*.mp4 | head -1)
          python - "$F" <<'E'
          import json, subprocess, sys
          f = sys.argv[1]
          d = float(subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',f],capture_output=True,text=True).stdout)
          ts = [0.0] + [round(x * 0.9, 2) for x in range(1, int(d / 0.9) + 1)]
          for i, t in enumerate(ts[:24]):
              subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-ss', str(t), '-i', f, '-frames:v', '1', '-vf', 'scale=270:-1', f'/tmp/v3/f{i:02d}.png'])
          subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', '/tmp/v3/f%02d.png', '-vf', 'tile=6x4:padding=6:color=white', '-frames:v', '1', 'research/results/v3/contact.jpg'])
          subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-ss', '0', '-i', f, '-frames:v', '1', 'research/results/v3/frame0.jpg'])
          E
          rm -f $OUT/v3_sample.mp4 $OUT/timeline.json $OUT/voice_used.txt
      - name: commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -- research/samples 2>/dev/null; git clean -fdq research/samples; git add -A research/results/v3 && git commit -qm "research: v3 render" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 10; done
