name: research v3 hq illustrations (experiment branch only)
on:
  push:
    branches: [research/ai-tools-2026-11]
    paths: ['research/tools/v3hq/**']
permissions:
  contents: write
jobs:
  img:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { idx: [0, 1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: build stable-diffusion.cpp
        run: |
          git clone -q --recursive --depth 1 https://github.com/leejet/stable-diffusion.cpp /tmp/sdcpp
          cd /tmp/sdcpp && cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON >/dev/null && cmake --build build -j4 --config Release >/dev/null
          ls build/bin
      - name: generate
        run: |
          pip install -q huggingface_hub pillow
          SD=$(ls /tmp/sdcpp/build/bin/sd-cli 2>/dev/null || ls /tmp/sdcpp/build/bin/sd)
          curl -sfL -o /tmp/esrgan.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
          ls -la /tmp/esrgan.pth
          OUT=research/results/v3tools/imghq; mkdir -p $OUT
          python research/tools/v3hq/img_hq.py $OUT ${{ matrix.idx }} $SD /tmp/esrgan.pth || true
          python -c "
          from PIL import Image
          im=Image.open('$OUT/img${{ matrix.idx }}.png').convert('RGB'); print(im.size)
          im.resize((1080,1920),Image.LANCZOS).save('$OUT/img${{ matrix.idx }}.jpg',quality=93)
          " && rm $OUT/img${{ matrix.idx }}.png || true
          cat $OUT/img${{ matrix.idx }}.json || true
      - name: commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add research/results/v3tools && git commit -qm "research: v3 img ${{ matrix.idx }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
