name: research v4 cpu video (experiment branch only)
on:
  push:
    branches: [research/ai-tools-2026-11]
    paths: ['research/tools/v4video/**']
permissions:
  contents: write
jobs:
  i2v:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: { idx: [0, 1] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null || true
      - name: build stable-diffusion.cpp
        run: |
          git clone -q --recursive --depth 1 https://github.com/leejet/stable-diffusion.cpp /tmp/sdcpp
          cd /tmp/sdcpp && cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON >/dev/null && cmake --build build -j4 --config Release >/dev/null
          ls build/bin; nproc; free -g
      - name: generate
        run: |
          pip install -q huggingface_hub pillow
          SD=$(ls /tmp/sdcpp/build/bin/sd-cli 2>/dev/null || ls /tmp/sdcpp/build/bin/sd)
          OUT=research/results/v4video/job${{ matrix.idx }}
          python research/tools/v4video/run_i2v.py ${{ matrix.idx }} $SD $OUT || true
          ls -la $OUT
          for f in $OUT/*.avi $OUT/*.webm $OUT/*.mp4; do [ -f "$f" ] || continue; ffmpeg -nostdin -y -loglevel error -i "$f" -c:v libx264 -crf 18 -pix_fmt yuv420p "${f%.*}_h264.mp4" && [ "${f##*.}" != mp4 ] && rm "$f"; done
          ls -la $OUT
      - name: commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add research/results/v4video && git commit -qm "research: v4 cpu i2v ${{ matrix.idx }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
