name: Collect performance data

on:
  schedule:
    - cron: "13 14 * * *"   # daily 23:13 KST: our post insights
    - cron: "43 20 * * 0"   # Monday 05:43 KST: benchmark accounts (Business Discovery)
  workflow_dispatch:
    inputs:
      mode:
        description: "insights or benchmark"
        default: insights

permissions:
  contents: write

concurrency:
  group: instagram-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "43 20 * * 0" ]; then MODE=benchmark; else MODE=insights; fi
          fi
          python scripts/collect.py "$MODE"
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Collect data [skip ci]"; git pull --rebase; git push; fi
