name: Collect performance data

on:
  schedule:
    - cron: "13 14 * * *"   # daily 23:13 KST: our post insights
    - cron: "47 13 * * 0"   # Sunday 22:47 KST: full weekly benchmark (finished well before the Monday 02:47 review)
    - cron: "23 20 * * *"   # daily 05:23 KST: light benchmark pull for the morning topic radar
  workflow_dispatch:
    inputs:
      mode:
        description: "insights, benchmark or bench_daily"
        default: insights

permissions:
  contents: write

concurrency:
  group: instagram-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        if: inputs.mode != 'insights' && inputs.mode != 'study' && github.event.schedule != '13 14 * * *'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor >/dev/null
          pip install -q opencv-python-headless pillow numpy
      - name: Collect
        timeout-minutes: 90
        env:
          IG_LOGIN_TOKEN: ${{ secrets.IG_LOGIN_TOKEN }}   # Instagram Login (no Facebook), used first
          IG_LOGIN_USER_ID: ${{ secrets.IG_LOGIN_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_IGLOGIN_TOKEN: ${{ secrets.IG_IGLOGIN_TOKEN }}   # Instagram Login token (IGAA...) used for reels (2026-11-10)
          IG_IGLOGIN_USER_ID: ${{ secrets.IG_IGLOGIN_USER_ID }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "47 13 * * 0") MODE=benchmark ;;
              "23 20 * * *") MODE=bench_daily ;;
              *) MODE=insights ;;
            esac
          fi
          python scripts/collect.py "$MODE"
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Collect data [skip ci]"; git pull --rebase; git push; fi
