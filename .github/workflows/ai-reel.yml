name: AI reel render (jungle.gcc)
# Renders every reel folder under ai/reels/ that changed in the push (or the one given by hand).
# Output: media/ai/<id>/reel.mp4 (with self-made music), reel_nomusic.mp4 (for app music), cover.jpg, contact.jpg, timeline.json
on:
  push:
    branches: [main]
    paths: ['ai/reels/**', '!ai/reels/**/assets/**']
  workflow_dispatch:
    inputs:
      reel: { description: "reel folder name under ai/reels (e.g. 2026-11-13-subscription)", required: true }
permissions:
  contents: write
concurrency: { group: ai-reel, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: which reels
        id: which
        run: |
          if [ -n "${{ github.event.inputs.reel }}" ]; then R="${{ github.event.inputs.reel }}"; else
            R=$(git diff --name-only HEAD^ HEAD -- ai/reels | grep -v '/assets/' | cut -d/ -f3 | sort -u | tr '\n' ' '); fi
          echo "reels=$R" >> $GITHUB_OUTPUT; echo "reels: $R"
      - run: sudo apt-get install -y -qq ffmpeg libsndfile1 fonts-noto-cjk >/dev/null || true
      - name: deps
        run: pip install -q numpy soundfile pillow scipy supertonic
      - name: render
        env: { HYPERFRAMES_TELEMETRY_DISABLED: "1", DO_NOT_TRACK: "1" }
        run: |
          set -u
          mkdir -p /tmp/fonts; for W in Medium SemiBold Bold ExtraBold Black; do curl -sfL -o /tmp/fonts/Pretendard-$W.woff2 https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-$W.woff2 || echo font-fail $W; done
          for R in ${{ steps.which.outputs.reels }}; do
            D=ai/reels/$R; [ -f $D/index.html ] || { echo "skip $R"; continue; }
            echo "==== $R"
            mkdir -p $D/assets/fonts; cp /tmp/fonts/*.woff2 $D/assets/fonts/
            for i in 0 1 2 3 4 5 6; do [ -f $D/assets/img$i.jpg ] || cp ai/chars/img$i.jpg $D/assets/ 2>/dev/null || true; done
            for i in 0 2 3 4 5; do [ -f $D/assets/cut$i.png ] || python ai/template/cutout.py $D/assets/img$i.jpg $D/assets/cut$i.png; done
            cp docs/assets/avatar.png $D/assets/avatar.png
            W=/tmp/ai/$R; OUT=media/ai/$R; mkdir -p $W $OUT
            VOICE=$(head -1 $D/voice.txt 2>/dev/null || echo "supertonic F1 @1.25")
            (cd $D && python build.py "$VOICE" $W < /dev/null) || { echo "build fail $R"; continue; }
            (cd $D && npx -y hyperframes@latest render --output $W/silent.mp4 > $W/render.log 2>&1 < /dev/null) || { tail -40 $W/render.log; continue; }
            MUSIC=$(head -1 $D/music.txt 2>/dev/null || echo gen:chill)
            case "$MUSIC" in gen:*) python scripts/music.py ${MUSIC#gen:} 45 /tmp/music.wav jj-$R && MUSIC=/tmp/music.wav ;; esac
            DUR=$(python -c "import json;print(json.load(open('$W/timeline.json'))['dur'])"); FO=$(python -c "print(round($DUR-1.2,2))")
            ffmpeg -nostdin -y -loglevel error -i $W/silent.mp4 -i $W/narration.wav -i $W/sfx.wav -stream_loop -1 -i "$MUSIC" -filter_complex \
              "[1:a]aresample=48000,asplit[n][nk];[2:a]aresample=48000,volume=0.7[s];[3:a]aresample=48000,volume=0.16,afade=t=in:d=0.4,afade=t=out:st=$FO:d=1.2[m0];[m0][nk]sidechaincompress=threshold=0.02:ratio=6:attack=15:release=350[m];[n][s][m]amix=inputs=3:normalize=0:duration=first,alimiter=limit=0.95[a]" \
              -map 0:v -map "[a]" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -t $DUR $OUT/reel.mp4
            ffmpeg -nostdin -y -loglevel error -i $W/silent.mp4 -i $W/narration.wav -i $W/sfx.wav -filter_complex "[1:a]aresample=48000[n];[2:a]aresample=48000,volume=0.7[s];[n][s]amix=inputs=2:normalize=0:duration=first,alimiter=limit=0.95[a]" \
              -map 0:v -map "[a]" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -t $DUR $OUT/reel_nomusic.mp4
            CT=$(python -c "import json;t=json.load(open('$W/timeline.json'));print(t.get('cover_t',0.8))")
            ffmpeg -nostdin -y -loglevel error -ss $CT -i $W/silent.mp4 -frames:v 1 -q:v 2 $OUT/cover.jpg
            python - "$OUT/reel.mp4" "$OUT/contact.jpg" <<'E'
          import subprocess, sys, os
          f, out = sys.argv[1], sys.argv[2]
          d = float(subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',f],capture_output=True,text=True).stdout)
          os.makedirs('/tmp/cs', exist_ok=True)
          ts = [0.0] + [round(x * 0.9, 2) for x in range(1, int(d / 0.9) + 1)]
          for i, t in enumerate(ts[:30]):
              subprocess.run(['ffmpeg','-nostdin','-y','-loglevel','error','-ss',str(t),'-i',f,'-frames:v','1','-vf','scale=216:-1',f'/tmp/cs/f{i:02d}.png'])
          subprocess.run(['ffmpeg','-nostdin','-y','-loglevel','error','-i','/tmp/cs/f%02d.png','-vf','tile=6x5:padding=6:color=white','-frames:v','1',out])
          for p in os.listdir('/tmp/cs'): os.remove('/tmp/cs/'+p)
          E
            cp $W/timeline.json $OUT/timeline.json; echo "$R done: $(ls $OUT)"
          done
      - name: commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -- ai 2>/dev/null; git clean -fdq ai; git add -A media/ai && git commit -qm "ai: render ${{ steps.which.outputs.reels }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 10; done
