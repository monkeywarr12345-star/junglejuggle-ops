name: research hyperframes v2 (experiment branch only)
on:
  push:
    branches: [research/ai-tools-2026-11]
    paths: ['research/samples/hf2/**']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null || true
      - working-directory: research/samples/hf2
        env: { HYPERFRAMES_TELEMETRY_DISABLED: "1", DO_NOT_TRACK: "1" }
        run: |
          mkdir -p ../../results/hf2
          START=$(date +%s)
          npx -y hyperframes@latest check --json > ../../results/hf2/check.json 2>&1 || true
          npx -y hyperframes@latest render --output ../../results/hf2/hf2_sample.mp4 > ../../results/hf2/render.log 2>&1 || true
          echo "sec=$(( $(date +%s)-START ))" > ../../results/hf2/time.txt
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add research/results/hf2 && git commit -m "research: hf2 render" && git pull --rebase -q && git push || true
